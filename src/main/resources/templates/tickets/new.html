<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit a ticket</title>
</head>
<body>
<main>
    <h1>Submit a ticket</h1>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <form th:action="@{/tickets}" method="post">
        <p>
            <label for="title">Title</label><br>
            <input id="title" name="title" th:value="${title}" required maxlength="200">
        </p>
        <p>
            <label for="description">Description</label><br>
            <textarea id="description" name="description" th:text="${description}"
                      required maxlength="5000" rows="6" cols="60"></textarea>
        </p>
        <button type="submit">Submit ticket</button>
    </form>
    <p><a th:href="@{/tickets}">All tickets</a></p>
</main>
</body>
</html>
